<nav class="module-nav" aria-label="训练模块"><a href="index.html" aria-current="page">资料分析</a><a href="judgment.html" >判断推理</a></nav>
    <div class="topnote"><span class="edition">分类训练</span><span>原题图表 · 参考解析</span></div>

  <div class="layout">
    <aside class="sidebar" aria-label="考点分类">
      <div class="side-title">专项题库 <span id="total-count">325</span></div>
      <nav id="categories"></nav>
      <div class="sidebar-footer"><strong>每次专注一个考点</strong><p>先独立作答，再看解析。<br>图表与公式保留原卷内容。</p><div class="inventory"><span><b>11</b>年真题</span><span><b>27</b>套试卷</span></div></div>
    </aside>
    <main>
      <section id="practice-progress" class="practice-progress" aria-label="做题进度与完成记录"></section>
      <div class="workspace-heading"><div><div class="eyebrow">QUESTION BANK</div><h1 id="category-title">全部考点</h1><p id="category-description">选一道题，开始今天的练习。</p><p id="knowledge-progress" class="knowledge-progress" role="status"></p></div><div class="count-pill"><strong id="filtered-count">325</strong><span>道可练</span></div></div>
      <div id="analysis-groups" class="group-tabs" role="group" aria-label="资料分析题型"></div>
      <details class="type-guide" id="analysis-type-guide"><summary>题型体系与解题方法 <span id="analysis-guide-count"></span></summary><div id="analysis-guide-content"></div></details>
      <form class="filters" id="filters" autocomplete="off">
        <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="search" type="search" placeholder="搜索题干、年份或题号" aria-label="搜索题目"></label>

        <button type="button" class="text-button" id="reset">重置筛选</button>
      </form>
      <div class="practice-grid">
        <section class="catalog" aria-label="题目列表"><div class="catalog-heading"><strong>题目</strong><span id="result-info">按年份由近到远</span></div><div id="question-list"></div><div class="list-pager"><button id="list-prev" class="quiet-button" type="button">上一页</button><span id="list-page"></span><button id="list-next" class="quiet-button" type="button">下一页</button></div></section>

          <div class="empty"><h2>题库正在加载</h2><p>请选择左侧考点。</p></div>
        </article>
      </div>
      <p class="bottom-note">540道题次按同年同材料同一提问合并为325个训练条目，同题出处在题目中标注。知识点按花生十三系统班与思维导图划分，多考点题进入相关知识点，模块总进度按题目去重。解析来自所提供的参考答案文件。</p>
    </main>

  <dialog id="image-dialog"><div class="dialog-toolbar"><strong id="image-caption">原卷页面</strong><div class="zoom-controls"><button id="zoom-out" class="quiet-button" type="button">缩小</button><button id="zoom-in" class="quiet-button" type="button">放大</button><button id="close-image" class="quiet-button" type="button">关闭</button></div></div><div class="zoom-viewport"><img id="zoom-image" alt="放大的原卷内容"></div></dialog>
